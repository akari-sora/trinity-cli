workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

default:
  tags: [grok-box, ondemand, trinity-cli]
  interruptible: true
  retry:
    max: 1
    when: [runner_system_failure]

stages:
  - test
  - release

test:
  stage: test
  tags: [grok-box, ondemand, trinity-cli]
  image: python:3.12-slim
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  cache:
    key: pip-py3.12
    paths:
      - .cache/pip
  script:
    - pip install -e .
    - python -m unittest discover -s tests

# Python 3.11 argparse does not intermix options and positionals. README
# examples such as `hand … --to … "…"` depend on the parser workaround.
test:py311:
  stage: test
  tags: [grok-box, ondemand, trinity-cli]
  image: python:3.11-slim
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  cache:
    key: pip-py3.11
    paths:
      - .cache/pip
  script:
    - pip install -e .
    - python -m unittest discover -s tests

# The muse-web-cli that README pins, run for real in a throwaway home with
# --backend api. No Chrome, no Muse, no secrets. Fails when the pinned tag is missing.
contract:muse:
  stage: test
  tags: [grok-box, ondemand, trinity-cli]
  image: python:3.12-slim
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
    PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
  cache:
    key: pip-py3.12
    paths:
      - .cache/pip
  script:
    - |
      set -eu
      pin="$(python3 - <<'PY'
      import re, sys
      from pathlib import Path
      pins = sorted(set(re.findall(r"muse-web-cli\.git@(v[^\"\s]+)", Path("README.md").read_text(encoding="utf-8"))))
      if len(pins) != 1:
          sys.exit(f"README must pin exactly one muse-web-cli version, found {pins}")
      print(pins[0])
      PY
      )"
      pip install "https://gitlab.com/aa22396584/muse-web-cli/-/archive/${pin}/muse-web-cli-${pin}.tar.gz"
      pip install -e .
      TRINITY_MUSE_CONTRACT=1 python -m unittest -v tests.test_contract_muse

release-check:
  stage: test
  tags: [grok-box, ondemand, trinity-cli]
  image: python:3.12-slim
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - |
      python3 - <<'PY'
      import os, re, sys, tomllib
      from pathlib import Path
      tag = os.environ["CI_COMMIT_TAG"]
      version = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
      if tag != f"v{version}":
          sys.exit(f"tag {tag} does not match pyproject version {version}")
      newest = re.search(r"^## (\S+)(.*)$", Path("CHANGELOG.md").read_text(encoding="utf-8"), re.M)
      if not newest or newest.group(1) != version:
          sys.exit(f"the newest CHANGELOG section is not {version}")
      if "unreleased" in newest.group(2).lower():
          sys.exit(f"CHANGELOG {version} still says Unreleased")
      print(f"{tag} matches pyproject.toml and CHANGELOG.md")
      PY

# Windows jobs must not inherit the grok-box tags. Tags, manual web runs, and
# main pushes that change shipped code, tests, or packaging. A CI-only push
# still runs Linux only. Merge requests are manual: the self-hosted runner
# accepts protected refs only, so an unprotected source branch must not block.
.windows_python: &windows_python
  interruptible: true
  timeout: 20m
  variables:
    UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"
  cache:
    key: uv-win
    paths:
      - .cache/uv
  script:
    - |
      $ErrorActionPreference = "Stop"
      $env:UV_CACHE_DIR = Join-Path $env:CI_PROJECT_DIR ".cache/uv"
      if (-not (Get-Command uv -ErrorAction SilentlyContinue)) {
        $env:UV_INSTALL_DIR = Join-Path $env:CI_PROJECT_DIR ".uv"
        irm https://astral.sh/uv/install.ps1 | iex
        $env:Path = "$env:UV_INSTALL_DIR;$env:Path"
      }
      uv venv .venv --python 3.12
      uv pip install -e . --python .\.venv\Scripts\python.exe
      .\.venv\Scripts\python.exe -m unittest discover -s tests

test:windows:
  <<: *windows_python
  stage: test
  inherit:
    default: [retry]
  tags: [windows, hx370]
  needs:
    - job: test
    - job: test:py311
    - job: contract:muse
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - trinity_cli/**/*
        - tests/**/*
        - pyproject.toml
        - uv.lock

# Same tests on a GitLab-hosted runner. Starts only when someone plays it.
windows:hosted:
  <<: *windows_python
  stage: test
  inherit:
    default: [retry]
  tags: [saas-windows-medium-amd64]
  allow_failure: true
  needs:
    - job: test
    - job: test:py311
    - job: contract:muse
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
    - if: $CI_COMMIT_TAG
      when: manual
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - trinity_cli/**/*
        - tests/**/*
        - pyproject.toml
        - uv.lock
      when: manual

release:
  stage: release
  tags: [grok-box, ondemand, trinity-cli]
  image: python:3.12-slim
  interruptible: false
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - |
      set -eu
      arch="$(dpkg --print-architecture)"
      python3 - "$arch" <<'PY'
      import os, sys, urllib.request
      arch = sys.argv[1]
      url = (
          "https://gitlab.com/gitlab-org/release-cli/-/releases/v0.24.0/downloads/bin/release-cli-linux-"
          + arch
      )
      dest = "/usr/local/bin/release-cli"
      urllib.request.urlretrieve(url, dest)
      os.chmod(dest, 0o755)
      PY
      notes="$(python3 - <<'PY'
      import os, re
      from pathlib import Path
      tag = os.environ["CI_COMMIT_TAG"]
      fallback = f"Release {tag}"
      path = Path("CHANGELOG.md")
      if not path.is_file():
          print(fallback)
          raise SystemExit
      def bare(name):
          return name[1:] if name.startswith("v") else name
      want = {bare(tag)}
      lines = path.read_text(encoding="utf-8").splitlines()
      start = None
      for index, line in enumerate(lines):
          match = re.match(r"^##\s+(?:\[)?([^\]\s]+)", line)
          if match and bare(match.group(1)) in want:
              start = index + 1
              break
      if start is None:
          print(fallback)
          raise SystemExit
      body = []
      for line in lines[start:]:
          if line.startswith("## "):
              break
          body.append(line)
      text = "\n".join(body).strip() or fallback
      text += "\n" + "\n".join([
          "",
          "## Platforms",
          "- Linux: CI on the grok-box runner.",
          "- Windows: CI on a self-hosted Windows runner.",
          "- macOS: local development and live checks.",
          "",
          "## Install",
          "- macOS and Linux: uv or pipx. chatgpt-dot-cli v0.2.2, muse-web-cli v0.1.4, trinity-cli v0.4.5. gbot: download grok-bot-cli-0.11.2.tgz from the v0.11.2-iml1s.2 release and npm install -g that file. Node.js 22.19.0+. Commands are in the README.",
          "- Windows (PowerShell): irm https://astral.sh/uv/install.ps1 | iex, then the same uv pins. gbot: the same .tgz, then npm install -g .\\grok-bot-cli-0.11.2.tgz. Node.js 22.19.0+.",
          "",
          "## Related projects",
          "- trinity-cli (this repo) — one CLI over three always-on agents: https://gitlab.com/aa22396584/trinity-cli",
          "- chatgpt-dot-cli — ChatGPT Your dot: https://gitlab.com/aa22396584/chatgpt-dot-cli",
          "- grok-bot-cli (fork, gbot) — Grok Bot: https://gitlab.com/aa22396584/grok-bot-cli",
          "- muse-web-cli — Meta Muse via the web: https://gitlab.com/aa22396584/muse-web-cli",
      ])
      print(text)
      PY
      )"
      pip install -q build
      python3 -m build
      python3 - <<'PY'
      import os, pathlib, urllib.request
      tag = os.environ["CI_COMMIT_TAG"]
      base = (
          os.environ["CI_API_V4_URL"]
          + "/projects/"
          + os.environ["CI_PROJECT_ID"]
          + "/packages/generic/trinity-cli/"
          + tag
      )
      token = os.environ["CI_JOB_TOKEN"]
      lines = []
      for path in sorted(pathlib.Path("dist").iterdir()):
          if not path.is_file():
              continue
          url = base + "/" + path.name
          request = urllib.request.Request(
              url, data=path.read_bytes(), method="PUT", headers={"JOB-TOKEN": token}
          )
          with urllib.request.urlopen(request) as response:
              print(response.status, path.name)
          lines.append(
              '{"name":"%s","url":"%s","link_type":"package"}' % (path.name, url)
          )
      pathlib.Path("dist/asset-links.txt").write_text("\n".join(lines) + "\n", encoding="utf-8")
      PY
      link_args=()
      while IFS= read -r link; do
        [ -n "$link" ] && link_args+=(--assets-link "$link")
      done < dist/asset-links.txt
      if ! release-cli create --name "$CI_COMMIT_TAG" --tag-name "$CI_COMMIT_TAG" --description "$notes" "${link_args[@]}"; then
        status="$(python3 - <<'PY'
      import os, urllib.error, urllib.parse, urllib.request
      tag = urllib.parse.quote(os.environ["CI_COMMIT_TAG"], safe="")
      url = (
          os.environ["CI_API_V4_URL"]
          + "/projects/"
          + os.environ["CI_PROJECT_ID"]
          + "/releases/"
          + tag
      )
      request = urllib.request.Request(url, headers={"JOB-TOKEN": os.environ["CI_JOB_TOKEN"]})
      try:
          with urllib.request.urlopen(request) as response:
              print(response.status)
      except urllib.error.HTTPError as exc:
          print(exc.code)
      PY
      )"
        if [ "$status" = "200" ]; then
          echo "Release $CI_COMMIT_TAG already exists"
          exit 0
        fi
        echo "Release $CI_COMMIT_TAG was not created (HTTP $status)"
        exit 1
      fi

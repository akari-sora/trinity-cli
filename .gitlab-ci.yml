workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

default:
  tags: [grok-box, ondemand, trinity-cli]
  interruptible: true
  retry:
    max: 1
    when: [runner_system_failure]

stages:
  - test
  - release

test:
  stage: test
  tags: [grok-box, ondemand, trinity-cli]
  image: python:3.12-slim
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  cache:
    key: pip-py3.12
    paths:
      - .cache/pip
  script:
    - pip install -e .
    - python -m unittest discover -s tests

# Hosted Windows runners do not use a Docker image. Inherit only retry settings
# so this job is not also tagged grok-box (those runners would never match).
test:windows:
  stage: test
  inherit:
    default: [interruptible, retry]
  tags: [saas-windows-medium-amd64]
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG
  variables:
    UV_INSTALL_DIR: '$CI_PROJECT_DIR\uv-install'
    UV_CACHE_DIR: '$CI_PROJECT_DIR\.cache\uv'
  cache:
    key: uv-win
    paths:
      - .cache/uv
      - uv-install
  script:
    - |
      $ErrorActionPreference = "Stop"
      $env:Path = "$env:UV_INSTALL_DIR;$env:USERPROFILE\.local\bin;" + $env:Path
      if (-not (Get-Command uv -ErrorAction SilentlyContinue)) {
        irm https://astral.sh/uv/install.ps1 | iex
        $env:Path = "$env:UV_INSTALL_DIR;$env:USERPROFILE\.local\bin;" + $env:Path
      }
      uv venv .venv
      uv pip install -e . --python .\.venv\Scripts\python.exe
      .\.venv\Scripts\python.exe -m unittest discover -s tests

release:
  stage: release
  tags: [grok-box, ondemand, trinity-cli]
  image: python:3.12-slim
  interruptible: false
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - |
      set -eu
      arch="$(dpkg --print-architecture)"
      python3 - "$arch" <<'PY'
      import os, sys, urllib.request
      arch = sys.argv[1]
      url = (
          "https://gitlab.com/gitlab-org/release-cli/-/releases/v0.24.0/downloads/bin/release-cli-linux-"
          + arch
      )
      dest = "/usr/local/bin/release-cli"
      urllib.request.urlretrieve(url, dest)
      os.chmod(dest, 0o755)
      PY
      notes="$(python3 - <<'PY'
      import os, re
      from pathlib import Path
      tag = os.environ["CI_COMMIT_TAG"]
      fallback = f"Release {tag}"
      path = Path("CHANGELOG.md")
      if not path.is_file():
          print(fallback)
          raise SystemExit
      def bare(name):
          return name[1:] if name.startswith("v") else name
      want = {bare(tag)}
      lines = path.read_text(encoding="utf-8").splitlines()
      start = None
      for index, line in enumerate(lines):
          match = re.match(r"^##\s+(?:\[)?([^\]\s]+)", line)
          if match and bare(match.group(1)) in want:
              start = index + 1
              break
      if start is None:
          print(fallback)
          raise SystemExit
      body = []
      for line in lines[start:]:
          if line.startswith("## "):
              break
          body.append(line)
      text = "\n".join(body).strip() or fallback
      text += "\n" + "\n".join([
          "",
          "## Platforms",
          "- Linux: CI on the grok-box runner.",
          "- Windows: CI on GitLab hosted runners (saas-windows-medium-amd64).",
          "- macOS: local development and live checks.",
          "",
          "## Install",
          "- macOS and Linux: uv or pipx. chatgpt-dot-cli v0.2.2, muse-web-cli v0.1.2, trinity-cli v0.4.1. gbot fork: npm install -g github:ImL1s/grok-bot-cli#v0.11.2-iml1s.2. Commands are in the README.",
          "- Windows (PowerShell): irm https://astral.sh/uv/install.ps1 | iex, then the same uv pins. gbot: npm install -g github:ImL1s/grok-bot-cli#v0.11.2-iml1s.2.",
          "",
          "## Related projects",
          "- trinity-cli (this repo) — one CLI over three always-on agents: https://gitlab.com/aa22396584/trinity-cli",
          "- chatgpt-dot-cli — ChatGPT Your dot: https://gitlab.com/aa22396584/chatgpt-dot-cli",
          "- grok-bot-cli (fork, gbot) — Grok Bot: https://gitlab.com/aa22396584/grok-bot-cli (mirror https://github.com/ImL1s/grok-bot-cli)",
          "- muse-web-cli — Meta Muse via the web: https://gitlab.com/aa22396584/muse-web-cli",
      ])
      print(text)
      PY
      )"
      pip install -q build
      python3 -m build
      python3 - <<'PY'
      import os, pathlib, urllib.request
      tag = os.environ["CI_COMMIT_TAG"]
      base = (
          os.environ["CI_API_V4_URL"]
          + "/projects/"
          + os.environ["CI_PROJECT_ID"]
          + "/packages/generic/trinity-cli/"
          + tag
      )
      token = os.environ["CI_JOB_TOKEN"]
      lines = []
      for path in sorted(pathlib.Path("dist").iterdir()):
          if not path.is_file():
              continue
          url = base + "/" + path.name
          request = urllib.request.Request(
              url, data=path.read_bytes(), method="PUT", headers={"JOB-TOKEN": token}
          )
          with urllib.request.urlopen(request) as response:
              print(response.status, path.name)
          lines.append(
              '{"name":"%s","url":"%s","link_type":"package"}' % (path.name, url)
          )
      pathlib.Path("dist/asset-links.txt").write_text("\n".join(lines) + "\n", encoding="utf-8")
      PY
      link_args=()
      while IFS= read -r link; do
        [ -n "$link" ] && link_args+=(--assets-link "$link")
      done < dist/asset-links.txt
      if ! release-cli create --name "$CI_COMMIT_TAG" --tag-name "$CI_COMMIT_TAG" --description "$notes" "${link_args[@]}"; then
        status="$(python3 - <<'PY'
      import os, urllib.error, urllib.parse, urllib.request
      tag = urllib.parse.quote(os.environ["CI_COMMIT_TAG"], safe="")
      url = (
          os.environ["CI_API_V4_URL"]
          + "/projects/"
          + os.environ["CI_PROJECT_ID"]
          + "/releases/"
          + tag
      )
      request = urllib.request.Request(url, headers={"JOB-TOKEN": os.environ["CI_JOB_TOKEN"]})
      try:
          with urllib.request.urlopen(request) as response:
              print(response.status)
      except urllib.error.HTTPError as exc:
          print(exc.code)
      PY
      )"
        if [ "$status" = "200" ]; then
          echo "Release $CI_COMMIT_TAG already exists"
          exit 0
        fi
        echo "Release $CI_COMMIT_TAG was not created (HTTP $status)"
        exit 1
      fi

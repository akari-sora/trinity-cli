[project]
name = "trinity-cli"
version = "0.4.4"
description = "One command in front of your always-on personal agents: ChatGPT Your dot, Grok Bot, and Muse."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
license = { text = "MIT" }

[project.urls]
Homepage = "https://gitlab.com/aa22396584/trinity-cli"
Repository = "https://gitlab.com/aa22396584/trinity-cli"
Issues = "https://gitlab.com/aa22396584/trinity-cli/-/issues"

[project.scripts]
trinity-cli = "trinity_cli.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["trinity_cli*"]
